name: Task
description: A piece of work for the app or its documentation
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App
        - Documentation (README, cost model, walkthrough)
        - Release (packaging, deployment)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: The outcome, not the steps.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished.
      placeholder: "- [ ] ..."
    validations:
      required: true
