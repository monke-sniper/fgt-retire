name: Task
description: A piece of work for the app or the submission
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App
        - Pitch (slides, money model, video)
        - Submission (Devpost, form)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: The outcome, not the steps.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished.
      placeholder: "- [ ] ..."
    validations:
      required: true
